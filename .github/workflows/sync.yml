name: Continuous Recon Scanner

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours leaves ~15 minutes after the 5h45m scan window.
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: continuous-recon-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 345 # 5 hours 45 minutes
    env:
      PYTHONUNBUFFERED: "1"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Run checkpointed scanner
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="$PWD"
          DATA="$ROOT/data"
          TOOLS="$ROOT/tools"
          DOMAINS="$DATA/all-domains.txt"
          STATE="$DATA/.scan-state.json"
          # Intermediate archive files live outside the repo so they are
          # never git-added (avoids GitHub 100 MB file-size limit).
          WORK_ROOT="${RUNNER_TEMP:-/tmp}/recon-work"
          START_EPOCH="$(date +%s)"
          # Keep a small margin below the hard 345-minute GitHub job limit.
          DEADLINE="$((START_EPOCH + 342 * 60))"

          mkdir -p "$DATA" "$WORK_ROOT"

          python - "$DOMAINS" "$STATE" <<'PY'
          import json, pathlib, sys
          domains = pathlib.Path(sys.argv[1])
          state = pathlib.Path(sys.argv[2])
          if not state.exists():
              state.write_text(json.dumps({
                  "domain_index": 0,
                  "stage": "archive",
                  "domain": "",
              }, indent=2) + "\n")
          PY

          save_state() {
            local domain="$1"
            local stage="$2"
            local di="$3"
            python - "$STATE" "$domain" "$stage" "$di" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          p.write_text(json.dumps({
              "domain": sys.argv[2],
              "stage": sys.argv[3],
              "domain_index": int(sys.argv[4]),
          }, indent=2) + "\n")
          PY
          }

          # Remove a fully-scanned domain from all-domains.txt (preserves order of remaining lines).
          remove_domain_from_list() {
            local domain="$1"
            python - "$DOMAINS" "$domain" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          target = sys.argv[2].strip().lower()
          if not path.exists():
              sys.exit(0)
          lines = path.read_text().splitlines()
          new_lines = []
          for line in lines:
              stripped = line.strip()
              if not stripped or stripped.startswith("#"):
                  new_lines.append(line)
                  continue
              if stripped.lower() != target:
                  new_lines.append(line)
          path.write_text("\n".join(new_lines) + ("\n" if new_lines else ""))
          PY
          }

          # Only commit small final artifacts + state. Never commit WORK_ROOT.
          git_commit_state() {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Explicit paths only — avoids accidentally staging large files.
            git add -- "$STATE" 2>/dev/null || true
            # Add every domain result directory (small text outputs only).
            if [[ -d "$DATA" ]]; then
              find "$DATA" -maxdepth 2 -type f \( \
                -name 'all-uniq-routs.txt' -o \
                -name 'all-uniq-params.txt' -o \
                -name 'xss-vulnerable.txt' -o \
                -name 'all-domains.txt' \
              \) -print0 2>/dev/null | xargs -0 -r git add --
              git add -- "$STATE" 2>/dev/null || true
            fi
            if ! git diff --cached --quiet 2>/dev/null; then
              git commit -m "scanner: checkpoint $1" || true
              git push || true
            fi
          }

          now() { date +%s; }
          time_left() { echo $((DEADLINE - $(now))); }

          # Return 0 only if enough time remains for another stage.
          have_time() {
            local need="${1:-120}"
            [[ "$(time_left)" -gt "$need" ]]
          }

          # Load domains preserving file order (first occurrence only, no sort).
          mapfile -t DOMAINS_LIST < <(
            awk '
              /^[[:space:]]*(#|$)/ { next }
              {
                gsub(/[[:space:]]/, "", $0)
                if ($0 == "") next
                key = tolower($0)
                if (!(key in seen)) {
                  seen[key] = 1
                  print $0
                }
              }
            ' "$DOMAINS"
          )

          # Load checkpoint.
          readarray -t ST < <(python - "$STATE" <<'PY'
          import json, pathlib, sys
          s=json.loads(pathlib.Path(sys.argv[1]).read_text())
          for k in ("domain", "stage", "domain_index"):
              print(s.get(k, "" if k in ("domain", "stage") else 0))
          PY
          )
          CURRENT_DOMAIN="${ST[0]}"
          CURRENT_STAGE="${ST[1]}"
          DOMAIN_INDEX="${ST[2]:-0}"

          # Always start from the first domain in the *current* list.
          # Resume stage only when the first domain matches the saved domain.
          # This way, if you reorder / prepend a new domain, the next run
          # picks the new first domain (from archive) instead of the old one.
          if (( ${#DOMAINS_LIST[@]} > 0 )); then
            FIRST="${DOMAINS_LIST[0]}"
            if [[ "$CURRENT_DOMAIN" == "$FIRST" && "$CURRENT_STAGE" != "done-domain" && "$CURRENT_STAGE" != "idle" ]]; then
              DOMAIN_INDEX=0
              # keep CURRENT_STAGE as loaded
            else
              DOMAIN_INDEX=0
              CURRENT_DOMAIN="$FIRST"
              CURRENT_STAGE="archive"
              save_state "$FIRST" "archive" 0
            fi
          else
            DOMAIN_INDEX=0
            CURRENT_DOMAIN=""
            CURRENT_STAGE="idle"
          fi

          # Clear any leftover "done-domain" so we do not skip the first entry.
          if [[ "$CURRENT_STAGE" == "done-domain" ]]; then
            CURRENT_STAGE="archive"
            CURRENT_DOMAIN=""
          fi

          while have_time 180; do
            # Reload list each iteration so removals take effect immediately.
            mapfile -t DOMAINS_LIST < <(
              awk '
                /^[[:space:]]*(#|$)/ { next }
                {
                  gsub(/[[:space:]]/, "", $0)
                  if ($0 == "") next
                  key = tolower($0)
                  if (!(key in seen)) {
                    seen[key] = 1
                    print $0
                  }
                }
              ' "$DOMAINS"
            )

            if (( ${#DOMAINS_LIST[@]} == 0 )); then
              echo "[+] All configured domains have been processed (list empty)."
              save_state "" "idle" 0
              git_commit_state "idle"
              exit 0
            fi

            # Always work on the first remaining domain.
            DOMAIN_INDEX=0
            DOMAIN="${DOMAINS_LIST[$DOMAIN_INDEX]}"
            DOMAIN_DIR="$DATA/$DOMAIN"
            mkdir -p "$DOMAIN_DIR"

            # A domain begins at archive, unless a checkpoint says otherwise
            # *and* it is still the first domain in the list.
            if [[ "$CURRENT_DOMAIN" != "$DOMAIN" ]]; then
              CURRENT_DOMAIN="$DOMAIN"
              CURRENT_STAGE="archive"
              save_state "$DOMAIN" "archive" "$DOMAIN_INDEX"
              git_commit_state "$DOMAIN-start"
            fi

            WORK="$WORK_ROOT/$DOMAIN"
            mkdir -p "$WORK"

            # ----------------------------------------------------------
            # Stage: archive — stream query URLs from Wayback CDX
            # Intermediate files stay in WORK_ROOT (outside the repo).
            # ----------------------------------------------------------
            if [[ "$CURRENT_STAGE" == "archive" ]]; then
              if ! have_time 180; then break; fi
              echo "[*] [$DOMAIN] Fetching archive URLs..."
              rm -f "$WORK/q-urls.txt"

              TARGET="https://${DOMAIN}/"
              # Stream: never write the full CDX dump to disk.
              # Filter query-URLs and exclude common static extensions.
              wget -qO- \
                "https://web.archive.org/cdx/search/cdx?url=${TARGET}&matchType=domain&fl=original&collapse=urlkey&output=text&filter=statuscode:200" \
                2>/dev/null |
                fgrep '?' |
                egrep -i -v '\.(js|gif|jpg|jpeg|png|css|gz|svg|ico|webp|avif|bmp|txt|pdf|xml|json|map|mp4|webm|ogv|mov|mp3|wav|ogg|flac|aac|m4a|woff|woff2|ttf|otf|eot|zip|rar|7z|tar)(\?|$)' |
                awk 'NF && !seen[$0]++' \
                > "$WORK/q-urls.txt" || true

              COUNT=$(wc -l < "$WORK/q-urls.txt" 2>/dev/null | tr -d ' ' || echo 0)
              echo "[+] [$DOMAIN] archive stage finished — ${COUNT} query URL(s)"
              # Do NOT git-commit q-urls.txt (can be hundreds of MB).
              save_state "$DOMAIN" "route-recon" "$DOMAIN_INDEX"
              git_commit_state "$DOMAIN-archive"
            fi

            # If we resumed into route-recon but the temp file is gone
            # (ephemeral runner /tmp), re-fetch archive first.
            if [[ "$CURRENT_STAGE" == "route-recon" ]]; then
              if [[ ! -s "$WORK/q-urls.txt" ]]; then
                echo "[!] [$DOMAIN] q-urls.txt missing — re-running archive fetch"
                CURRENT_STAGE="archive"
                continue
              fi
            fi

            # ----------------------------------------------------------
            # Stage: route-recon — unique params + unique routes
            # ----------------------------------------------------------
            if [[ "$CURRENT_STAGE" == "route-recon" ]]; then
              if ! have_time 120; then break; fi
              echo "[*] [$DOMAIN] Running archive_uniq_params_routes..."
              rm -f "$DOMAIN_DIR/all-uniq-routs.txt" "$DOMAIN_DIR/all-uniq-params.txt"

              if [[ -s "$WORK/q-urls.txt" ]]; then
                python3 "$TOOLS/archive_uniq_params_routes.py" \
                  -f "$WORK/q-urls.txt" \
                  -ro "$DOMAIN_DIR/all-uniq-routs.txt" \
                  -po "$DOMAIN_DIR/all-uniq-params.txt" || true
              else
                : > "$DOMAIN_DIR/all-uniq-routs.txt"
                : > "$DOMAIN_DIR/all-uniq-params.txt"
                echo "[i] [$DOMAIN] no archive query URLs — empty outputs"
              fi

              # Free the large intermediate file as soon as it is consumed.
              rm -f "$WORK/q-urls.txt"

              echo "[+] [$DOMAIN] archive_uniq_params_routes finished"
              save_state "$DOMAIN" "xss" "$DOMAIN_INDEX"
              git_commit_state "$DOMAIN-route-recon"
            fi

            # ----------------------------------------------------------
            # Stage: xss — reflection checker only
            # ----------------------------------------------------------
            if [[ "$CURRENT_STAGE" == "xss" ]]; then
              if ! have_time 120; then break; fi
              echo "[*] [$DOMAIN] Running xss_reflect_checker..."
              rm -f "$DOMAIN_DIR/xss-vulnerable.txt"

              # Ensure input files exist even if previous stage produced nothing.
              [[ -e "$DOMAIN_DIR/all-uniq-routs.txt" ]] || : > "$DOMAIN_DIR/all-uniq-routs.txt"
              [[ -e "$DOMAIN_DIR/all-uniq-params.txt" ]] || : > "$DOMAIN_DIR/all-uniq-params.txt"

              python3 "$TOOLS/xss_reflect_checker.py" \
                -l "$DOMAIN_DIR/all-uniq-routs.txt" \
                -p "$DOMAIN_DIR/all-uniq-params.txt" \
                -o "$DOMAIN_DIR/xss-vulnerable.txt" || true

              echo "[+] [$DOMAIN] xss_reflect_checker finished"
              save_state "$DOMAIN" "complete-domain" "$DOMAIN_INDEX"
              git_commit_state "$DOMAIN-xss"
            fi

            # ----------------------------------------------------------
            # Stage: complete-domain — finalize, remove from list, advance
            # ----------------------------------------------------------
            if [[ "$CURRENT_STAGE" == "complete-domain" ]]; then
              for f in all-uniq-routs.txt all-uniq-params.txt xss-vulnerable.txt; do
                [[ -e "$DOMAIN_DIR/$f" ]] || : > "$DOMAIN_DIR/$f"
              done
              rm -rf "$WORK"

              # Remove the finished domain from all-domains.txt so the next
              # domain becomes the new first entry on subsequent runs.
              echo "[*] [$DOMAIN] Removing from all-domains.txt after full scan"
              remove_domain_from_list "$DOMAIN"

              CURRENT_DOMAIN=""
              CURRENT_STAGE="archive"
              DOMAIN_INDEX=0
              save_state "" "done-domain" 0
              git_commit_state "$DOMAIN-complete"
              continue
            fi

            # Refresh stage from state after each stage transition.
            readarray -t ST < <(python - "$STATE" <<'PY'
          import json, pathlib, sys
          s=json.loads(pathlib.Path(sys.argv[1]).read_text())
          for k in ("domain", "stage", "domain_index"):
              print(s.get(k, "" if k in ("domain", "stage") else 0))
          PY
            )
            CURRENT_DOMAIN="${ST[0]}"
            CURRENT_STAGE="${ST[1]}"
            DOMAIN_INDEX="${ST[2]:-0}"
          done

          echo "[+] Scan window ended; next scheduled/manual run resumes from data/.scan-state.json."
